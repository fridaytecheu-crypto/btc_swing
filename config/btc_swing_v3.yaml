# BTC Swing V3 — Active Multi-Timeframe Swing. Pre-registered research configuration.
# Every value is frozen by docs/BTC_SWING_V3_DESIGN.md before any result was inspected.
# Paper/backtest only. No live trading. Nothing here is searched or tuned.
strategy_name: btc_swing_v3_active_swing

instrument:
  symbol: BTCUSDT
  market: binance_um_perp
  spot_symbol: BTCUSDT
  quote: USDT

data:
  provider: binance_vision
  base_timeframe: 5m
  latency_minutes: 0
  ingest_native_timeframes: [1h, 4h, 1d]
  ingest_funding: true
  ingest_metrics: true
  ingest_premium_index: true
  ingest_mark_price: true
  ingest_spot: false

indicators:                       # one set for every timeframe; swing_k = fractal half-width
  ema_fast: 21
  ema_slow: 50
  ema_trend: 200                  # present for schema compatibility; not used by V3 rules
  atr_period: 14
  swing_k: 2
  donchian_period: 20             # not used by V3 rules
  min_bars: {5m: 220, 15m: 220, 1h: 220, 4h: 220, 1d: 60}

context:
  trend_tf: 4h                    # EMA21 > EMA50 and close > EMA50 -> UP (mirror DOWN)
  align_tf: 1h                    # EMA21 vs EMA50 on 1h must agree with the trade side
  vol_percentile_window: 100      # 1h ATR percentile over the previous 100 completed 1h bars

regime:                           # V3 structural context, PIT, reported not gated
  vol_expansion_percentile: 0.8
  vol_expansion_4h_atr_ratio: 1.3
  vol_compression_percentile: 0.2
  d1_slope_bars: 5

setups:
  min_rr: 1.5                     # (structural target - entry ref) / stop distance, every family
  tp2_cap_r: 4.0
  min_stop_atr: 0.4               # 1h ATR
  max_stop_atr: 3.0
  trend_pullback:
    impulse_min_atr: 1.5
    retrace_min: 0.382
    retrace_max: 0.786
    zone_pad_atr: 0.25
    stop_buffer_atr: 0.3
  breakout_retest:
    level_lookback_bars: 48       # 1h bars, ending two bars before the current one
    break_buffer_atr: 0.1
    retest_window_bars: 12        # 1h bars after the break
    retest_touch_atr: 0.25
    zone_inner_atr: 0.25
    zone_outer_atr: 0.5
    stop_buffer_atr: 0.5
    invalidation_atr: 0.25
  liquidity_sweep:
    sweep_min_atr: 0.15
    reclaim_window_bars: 4        # 15m bars after the sweep bar
    zone_inner_atr: 0.1
    zone_outer_atr: 0.5
    stop_buffer_atr: 0.25
  volatility_expansion:
    compression_percentile: 0.25
    compression_lookback_bars: 12 # 1h bars
    expansion_range_atr: 1.8
    close_location: 0.7
    breakout_lookback_bars: 12    # 1h bars
    volume_mult: 1.5
    volume_lookback_bars: 20
    max_chase_atr: 1.5
    confirm_window_bars: 4        # 15m bars after the expansion bar
    confirm_max_above_atr: 0.5
    stop_buffer_atr: 0.3

episode:
  watch_timeout_bars: 288         # 5m bars (24 h) from detection
  entry_ready_timeout_bars: 6     # 5m bars (30 min) for the execution rule
  cooldown_bars_after_close: 12
  cooldown_bars_after_invalidation: 6
  max_concurrent_positions: 1
  dedupe_same_anchor: true
  anchor_tolerance_atr: 0.25
  family_priority: [TREND_PULLBACK_CONTINUATION, BREAKOUT_RETEST, LIQUIDITY_SWEEP_REVERSAL, VOLATILITY_EXPANSION_CONTINUATION]

risk:
  initial_equity: 10000.0
  risk_per_trade: 0.0025          # default stream 0.25%; a 0.5% stream is reported only
  report_risk_per_trade: 0.005
  allowed_leverage: [1, 2, 3, 5, 10]
  max_leverage: 10
  margin_cap_frac: 0.25
  maintenance_margin_rate: 0.005
  min_stop_to_liquidation_ratio: 3.0
  min_liquidation_distance_atr: 3.0
  liquidation_atr_tf: 4h
  compounding: false

exits:
  tp1_r: 1.0
  tp1_frac: 0.4
  tp2_frac: 0.3
  breakeven_after_tp1: true
  trail_tf: 15m
  trail_atr_buffer: 0.5
  max_hold_hours: 48
  evaluate_r_levels: [1.0, 1.5, 2.0, 3.0]

costs:
  taker_fee_bps: 5.0
  maker_fee_bps: 2.0
  use_maker_for_targets: false
  entry_slippage_bps: 2.0
  stop_slippage_bps: 5.0
  apply_funding: true
  default_funding_interval_hours: 8

safety_overlay:                   # reported separately; never used to select logic
  max_full_risk_losses_per_day: 3
  full_risk_loss_r: -0.9
  max_daily_loss_frac: 0.0075

research:
  start: "2022-01-01"
  end_exclusive: "2026-10-01"
  null_k: 10
  seed: 7
  leverage_caps: [1, 2, 3, 5, 10]
  min_cell_n: 20
  criteria:
    min_expectancy_r: 0.10
    min_profit_factor: 1.20
    min_positive_years: 4
    min_positive_quarter_share: 0.6
    min_quarter_trades: 10
    max_cost_drag_share: 0.5
    max_drawdown: 0.12
    min_trades_per_day: 0.5
    max_trades_per_day: 3.0
    median_hold_hours: [2.0, 12.0]
    max_family_pnl_share: 0.6
    min_expectancy_without_best5_r: 0.05
    max_quarter_pnl_share: 0.5
    b_min_profit_factor: 1.05
    b_min_positive_years: 3
    b_min_trades_per_day: 0.3
