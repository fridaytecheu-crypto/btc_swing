[project]
name = "btc-swing"
version = "1.0.0"
description = "BTC Leveraged Swing Engine V1 — deterministic, point-in-time research/backtest engine (paper only)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "polars>=1.0",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "typer>=0.12",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
btc-swing = "btc_swing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btc_swing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"btc_swing/**/*.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
